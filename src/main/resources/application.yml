app:
  name: '{{APP_NAME}}'
  jwt:
    secret: '{{JWT_SECRET}}'
    expires-in: PT30M
    refresh-expires-in: PT12H
  operation-log:
    enabled: true

server:
  port: 3000
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 2048

spring:
  application:
    name: '{{APP_NAME}}'
  datasource:
    url: jdbc:sqlite:data/app.db
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite
  jackson:
    mapper:
      # UserType 等枚举值为小写（admin/user）：入参大小写不敏感反序列化，对齐 TS 版
      accept-case-insensitive-enums: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: '{{APP_NAME}}'
